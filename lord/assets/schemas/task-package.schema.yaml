$schema: "https://json-schema.org/draft/2020-12/schema"
title: Lord standard/full task package
$comment: This schema validates a machine-readable YAML/JSON task package. It does not validate the Markdown template or its front matter alone.
type: object
required:
  - protocol_version
  - profile
  - project_id
  - task_id
  - task_version
  - updated_at
  - task_status
  - target_adapter
  - dispatch_mode
  - authoritative_state_source
  - objective
  - inputs
  - allowed_paths
  - forbidden_paths
  - expected_outputs
  - acceptance_criteria
  - validation_methods
  - depends_on
  - execution_environment
  - submission_path
properties:
  protocol_version:
    const: "0.4"
  profile:
    enum: [standard, full]
  project_id:
    type: string
    minLength: 1
  task_id:
    type: string
    pattern: "^Task-[A-Z]-[0-9]{2,}$"
  task_version:
    type: string
    minLength: 1
  updated_at:
    type: string
    format: date-time
  task_status:
    enum: [PENDING, READY, IN_PROGRESS, BLOCKED, REVIEW, REWORK, DONE, REJECTED, CANCELLED]
  target_adapter:
    enum: [generic-chat, coding, document, api, shared-workspace]
  dispatch_mode:
    enum: [direct, semi-automatic, manual-copy]
  authoritative_state_source:
    type: string
    minLength: 1
  background:
    type: string
  objective:
    type: string
    minLength: 1
  inputs:
    type: array
    items:
      type: string
  allowed_paths:
    type: array
    items:
      type: string
  forbidden_paths:
    type: array
    items:
      type: string
  expected_outputs:
    type: array
    minItems: 1
    items:
      type: string
  acceptance_criteria:
    type: object
    minProperties: 1
    patternProperties:
      "^AC-[0-9]{2,}$":
        type: string
        minLength: 1
    additionalProperties: false
  validation_methods:
    type: array
    items:
      type: string
  depends_on:
    type: array
    items:
      type: string
  execution_environment:
    $ref: "#/$defs/execution_environment"
  submission_path:
    type: string
    minLength: 1
  execution_steps:
    type: array
    items:
      type: string
  downstream_impact:
    type: array
    items:
      type: string
  output_language:
    type: string
  inherits:
    type: array
    items:
      type: string
  work_boundary:
    type: object
    properties:
      responsible_for:
        type: array
        items:
          type: string
      not_responsible_for:
        type: array
        items:
          type: string
    additionalProperties: false
additionalProperties: false
$defs:
  execution_environment:
    type: object
    required: [requires_python]
    properties:
      requires_python:
        type: boolean
      conda_env_path:
        type: [string, "null"]
      conda_env_name:
        type: [string, "null"]
      python_executable:
        type: [string, "null"]
      activation_command:
        type: [string, "null"]
      package_install_policy:
        type: [string, "null"]
    additionalProperties: false
