$schema: "https://json-schema.org/draft/2020-12/schema"
title: Lord micro task package
$comment: This schema validates a completed micro YAML task package, not the empty template before fields are filled.
type: object
required:
  - protocol_version
  - profile
  - project_id
  - task_id
  - task_version
  - updated_at
  - task_status
  - objective
  - inputs
  - allowed_paths
  - forbidden_paths
  - expected_outputs
  - acceptance_criteria
  - validation_methods
  - depends_on
  - inherits
  - execution_environment
  - submission_path
properties:
  protocol_version:
    const: "0.4"
  profile:
    const: micro
  project_id:
    type: string
    minLength: 1
  task_id:
    type: string
    pattern: "^Task-[A-Z]-[0-9]{2,}$"
  task_version:
    type: string
    minLength: 1
  updated_at:
    type: string
    format: date-time
  task_status:
    enum: [PENDING, READY, IN_PROGRESS, BLOCKED, REVIEW, REWORK, DONE, REJECTED, CANCELLED]
  objective:
    type: string
    minLength: 1
  inputs:
    type: array
    items:
      type: string
  allowed_paths:
    type: array
    items:
      type: string
  forbidden_paths:
    type: array
    items:
      type: string
  expected_outputs:
    type: array
    minItems: 1
    items:
      type: string
  acceptance_criteria:
    type: object
    minProperties: 1
    maxProperties: 3
    patternProperties:
      "^AC-[0-9]{2,}$":
        type: string
        minLength: 1
    additionalProperties: false
  validation_methods:
    type: array
    items:
      type: string
  depends_on:
    type: array
    items:
      type: string
  inherits:
    description: Repo-root paths to authoritative files whose stable defaults apply; explicit task fields override inherited defaults.
    type: array
    items:
      type: string
  execution_environment:
    $ref: "#/$defs/execution_environment"
  submission_path:
    type: string
    minLength: 1
additionalProperties: false
$defs:
  execution_environment:
    type: object
    required: [requires_python]
    properties:
      requires_python:
        type: boolean
      conda_env_path:
        type: [string, "null"]
      conda_env_name:
        type: [string, "null"]
      python_executable:
        type: [string, "null"]
      activation_command:
        type: [string, "null"]
      package_install_policy:
        type: [string, "null"]
    additionalProperties: false
