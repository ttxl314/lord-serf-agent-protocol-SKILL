$schema: "https://json-schema.org/draft/2020-12/schema"
title: Serf submission envelope
$comment: Validates the common envelope for REVIEW, BLOCKED, and CHANGE_REQUEST. For Markdown reports, validate parsed front matter; report-body structure remains template-defined.
type: object
allOf:
  - not:
      anyOf:
        - required: [agent_id]
        - required: [assigned_to]
        - required: [revision]
        - required: [status]
        - required: [submission_status]
        - required: [change_status]
        - required: [target_agent_type]
        - required: [required_files]
        - required: [allowed_changes]
        - required: [handoff_path]
        - required: [return_path]
        - required: [acceptance]
        - required: [lord_invocation]
        - required: [changed]
        - required: [result]
        - required: [validation]
required:
  - protocol_version
  - profile
  - project_id
  - task_id
  - executed_task_version
  - submitted_at
  - submission_type
  - task_package_path
  - report_path
properties:
  protocol_version:
    const: "0.6"
  profile:
    enum: [micro, standard, full]
  project_id:
    type: string
    minLength: 1
  task_id:
    type: string
    pattern: "^Task-[A-Z]-[0-9]{2,}$"
  executed_task_version:
    type: string
    minLength: 1
  submitted_at:
    type: string
    format: date-time
  submission_type:
    enum: [REVIEW, BLOCKED, CHANGE_REQUEST]
  task_package_path:
    type: string
    minLength: 1
  report_path:
    type: string
    minLength: 1
  execution_host:
    description: Optional app or host that executed the task, such as dsh or codex.
    type: string
    minLength: 1
additionalProperties: true
