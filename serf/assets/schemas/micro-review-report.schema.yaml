$schema: "https://json-schema.org/draft/2020-12/schema"
title: Serf micro review report
$comment: This schema validates a completed micro REVIEW YAML report.
type: object
required:
  - protocol_version
  - profile
  - project_id
  - task_id
  - executed_task_version
  - submitted_at
  - submission_type
  - task_package_path
  - changed_outputs
  - results
  - validation_results
  - assumptions
  - issues
  - report_path
properties:
  protocol_version:
    const: "0.5"
  profile:
    const: micro
  project_id:
    type: string
    minLength: 1
  task_id:
    type: string
    pattern: "^Task-[A-Z]-[0-9]{2,}$"
  executed_task_version:
    type: string
    minLength: 1
  submitted_at:
    type: string
    format: date-time
  submission_type:
    const: REVIEW
  task_package_path:
    type: string
    minLength: 1
  changed_outputs:
    type: array
    items:
      type: string
  results:
    type: array
    minItems: 1
    items:
      type: string
  validation_results:
    type: object
    minProperties: 1
    maxProperties: 3
    patternProperties:
      "^AC-[0-9]{2,}$":
        type: object
        required: [result, evidence]
        properties:
          result:
            enum: [PASS, FAIL, SKIPPED]
          evidence:
            type: string
            minLength: 1
        additionalProperties: false
    additionalProperties: false
  assumptions:
    type: array
    items:
      type: string
  issues:
    type: array
    items:
      type: string
  report_path:
    type: string
    minLength: 1
additionalProperties: false
